<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">

<meta name="theme-color" content="#007681">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22134%20110%20108%2094%22%3E%3Cpath%20fill%3D%22%23E57200%22%20d%3D%22M239.6%20131.8C239.2%20150.6%20215.5%20164.8%20210.4%20168C205.8%20171%20202%20170.8%20197.8%20168C191.4%20163.7%20168.9%20150.2%20169%20131.8C169%20120.8%20177.9%20111.8%20188.9%20111.8C193.3%20111.8%20197.6%20113.5%20200%20115.2C202.4%20116.9%20203.2%20117.3%20204.3%20117.3C205.4%20117.3%20206.1%20116.9%20208.6%20115.2C211.1%20113.5%20215.6%20111.8%20219.7%20111.8C230.7%20111.8%20239.6%20120.8%20239.6%20131.8%22/%3E%3Cpath%20fill%3D%22%23E57200%22%20d%3D%22M138.3%20170.6C140.8%20180.4%20150.9%20186.3%20160.7%20183.8C170.5%20181.2%20176.4%20171.2%20173.9%20161.3C171.3%20151.5%20161.3%20142.7%20152.5%20152.4C139.2%20152.2%20135.7%20160.8%20138.3%20170.6%22/%3E%3Cpath%20fill%3D%22%23E57200%22%20d%3D%22M152.5%20194C152.5%20197.9%20149.4%20201%20145.5%20201C141.6%20201%20138.4%20197.9%20138.4%20194C138.4%20190.1%20141.6%20186.9%20145.5%20186.9C149.4%20186.9%20152.5%20190.1%20152.5%20194%22/%3E%3Cpath%20fill%3D%22%23ee8a3c%22%20d%3D%22M158.8%20157.3C160.4%20160.4%20143.1%20170%20141.4%20167C139.7%20164%20142.2%20159.4%20147%20156.7C151.8%20154%20157.1%20154.3%20158.8%20157.3%22/%3E%3Cpath%20fill%3D%22%23ee8a3c%22%20d%3D%22M200%20119.1C202.6%20123.8%20175.6%20138.8%20173%20134.1C170.4%20129.4%20174.3%20122.2%20181.8%20118.1C189.3%20113.9%20197.4%20114.4%20200%20119.1%22/%3E%3Cpath%20fill%3D%22%23ee8a3c%22%20d%3D%22M145.5%20189.5C146%20191.1%20140.3%20196.3%20139.8%20194.7C139.3%20193%20140.1%20190.6%20141.6%20189.2C143.2%20187.7%20144.9%20187.9%20145.5%20189.5%22/%3E%3C/svg%3E">
<title>Painel de Faturamento</title>
<style>
:root{
  color-scheme: light;
  --page:#f1f4f4; --surface:#ffffff; --surface2:#f6f8f8; --ink:#1b2a2c; --ink2:#4c585a; --mut:#666a6e;
  --line:#dde3e3; --axis:#bfc9ca;
  --brand:#007681; --brand-t:#006570; --orange:#E57200; --gray:#75787B;
  --wash:rgba(0,118,129,.08); --bar:#93c4c9; --bar-hi:#007681; --meta:#75787B;
  --logo-t:#007681; --logo-o:#E57200; --logo-h:#ee8a3c; --logo-g:#75787B;
  --ok:#0ca30c; --ok-t:#006300; --warn:#fab219; --warn-t:#7a5000; --bad:#d03b3b; --bad-t:#b32a2a;
  --ok-bg:#e5f4e5; --warn-bg:#fdf2d6; --bad-bg:#f9e3e3;
  --focus:#005f68;
  --r-s:6px; --r-m:8px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  --fig: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d1415; --surface:#152022; --surface2:#1a2729; --ink:#e4eced; --ink2:#b3c0c2; --mut:#8d999b;
    --line:#243133; --axis:#384749;
    --brand:#3fb0bb; --brand-t:#6cc7d0;
    --wash:rgba(63,176,187,.12); --bar:#2b6a71; --bar-hi:#5cc3cd; --meta:#8f9396;
    --logo-t:#4fb6c0; --logo-g:#a3a6a9;
    --ok-t:#3fc23f; --warn-t:#f5c04a; --bad-t:#ee7a7a;
    --ok-bg:#16301a; --warn-bg:#352a10; --bad-bg:#3a1b1b;
    --focus:#6cc7d0;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.lt{fill:var(--logo-t)} .lo{fill:var(--logo-o)} .lh{fill:var(--logo-h)} .lg{fill:var(--logo-g)}
svg.logo{display:block;height:auto}

/* ---------- tela de senha */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:var(--r-m);padding:26px 24px 22px}
.gate svg.logo{width:200px;margin:0 0 22px}
.gate h1{font-size:1.25rem;font-weight:600;margin:0 0 4px}
.gate p{margin:0 0 18px;color:var(--ink2)}
.gate label.f{display:block;font-size:.85rem;color:var(--ink2);margin-bottom:6px}
.gate input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--axis);border-radius:var(--r-s);background:var(--surface2);font-size:1rem;letter-spacing:.04em}
.gate .chk{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:.9rem;color:var(--ink2)}
.gate .chk input{width:18px;height:18px;accent-color:var(--brand)}
.btn{appearance:none;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--r-s);padding:10px 16px;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:progress}
.gate .btn{width:100%}
.gate .err{color:var(--bad-t);font-size:.9rem;margin:12px 0 0;min-height:1.3em}
.ghost{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 12px;cursor:pointer;color:var(--ink2);font-size:.88rem}
.ghost:hover{border-color:var(--axis);color:var(--ink)}

/* ---------- cabeçalho com a marca */
.mast{background:var(--surface);border-top:4px solid var(--brand);border-bottom:1px solid var(--line)}
.mast .in{max-width:1180px;margin:0 auto;padding:16px 16px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px 24px;align-items:center}
.mast svg.logo{width:132px}
.mast .who{border-left:1px solid var(--line);padding-left:22px;min-width:0}
.mast h1{margin:0;font-size:1.5rem;font-weight:600;line-height:1.2}
.mast .sub{margin-top:3px;color:var(--ink2);font-size:.9rem}
.role{display:inline-block;border:1px solid var(--brand);color:var(--brand-t);border-radius:999px;padding:0 9px;font-size:.76rem;vertical-align:4px;margin-left:8px;font-weight:600}
.meta-h{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-end}
.meta-h div{font-size:.78rem;color:var(--mut)}
.meta-h b{display:block;font-family:var(--fig);font-size:.98rem;color:var(--ink);font-weight:600;margin-top:1px}
@media (max-width:860px){.mast .in{grid-template-columns:auto 1fr}.meta-h{grid-column:1/-1}}
@media (max-width:520px){.mast .in{grid-template-columns:1fr}.mast .who{border-left:0;padding-left:0}.mast svg.logo{width:116px}}

/* ---------- filtro */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.filters .lab{font-size:.88rem;color:var(--ink2);margin-right:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* ---------- cartões de indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-m);padding:13px 16px 14px;min-width:0}
.kpi.s-verde{border-left-color:var(--ok)} .kpi.s-amarelo{border-left-color:var(--warn)} .kpi.s-vermelho{border-left-color:var(--bad)}
.kpi .k{font-size:.86rem;color:var(--ink2)}
.kpi .v{font-family:var(--fig);font-size:clamp(1.3rem,2.3vw,1.7rem);font-weight:600;margin:3px 0 4px;line-height:1.15;white-space:nowrap}
@media (max-width:560px){.kpi{padding:11px 12px 12px}.kpi .v{font-size:1.1rem}}
.kpi .d{font-size:.82rem;color:var(--mut)}
.kpi .d b{font-weight:600;color:var(--ink2)}
.kpi .pill{white-space:normal;line-height:1.25}
.kpi .mini{position:relative;height:8px;border-radius:4px;background:var(--wash);margin:8px 0 6px}
.kpi .mini i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.kpi .mini u{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.kpis{grid-template-columns:1fr}}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 8px;font-size:.82rem;font-weight:600}
.pill i{font-style:normal;font-size:.76rem;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;color:#fff}
.pill.s-verde{background:var(--ok-bg);color:var(--ok-t)} .pill.s-verde i{background:var(--ok)}
.pill.s-amarelo{background:var(--warn-bg);color:var(--warn-t)} .pill.s-amarelo i{background:var(--warn);color:#3b2a00}
.pill.s-vermelho{background:var(--bad-bg);color:var(--bad-t)} .pill.s-vermelho i{background:var(--bad)}
.pill.s-nd{background:var(--wash);color:var(--ink2)} .pill.s-nd i{background:var(--mut)}

/* ---------- blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 18px 16px;margin-bottom:14px;min-width:0}
.card h2{font-size:1.08rem;font-weight:600;margin:0 0 2px}
.card .hint{font-size:.85rem;color:var(--mut);margin:0 0 12px}
details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{display:inline}
details.card>summary::after{content:"Mostrar";font-size:.85rem;color:var(--ink2);border:1px solid var(--line);border-radius:var(--r-s);padding:2px 10px;flex:none}
details.card[open]>summary::after{content:"Ocultar"}
details.card[open]>summary{margin-bottom:12px}
details.sub{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.sub>summary{cursor:pointer;color:var(--ink2);font-size:.92rem}

/* ---------- gráfico */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--ink2);margin:6px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:18px;height:2px;background:var(--brand);border-radius:1px}
.legend .ln.meta{background:var(--meta)}
.legend .bx{width:10px;height:10px;border-radius:2px;background:var(--bar)}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--mut)}
.chart .plab{font-size:11.5px;fill:var(--ink2)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:var(--r-s);padding:8px 10px;font-size:.82rem;min-width:190px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:3}
.tip .t{color:var(--ink2);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .r b{font-weight:600;color:var(--ink)}
.tip .key{width:12px;height:2px;background:var(--brand)}
.tip .key.meta{background:var(--meta)} .tip .key.bar{height:8px;width:8px;border-radius:2px;background:var(--bar)}

/* ---------- tabelas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
th{font-weight:600;color:var(--ink2);font-size:.82rem;vertical-align:bottom;background:var(--surface2);white-space:normal;min-width:64px}
th button{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;display:inline-flex;gap:4px;align-items:center}
th[aria-sort] button::after{content:"";font-size:.7rem;color:var(--brand-t)}
th[aria-sort=ascending] button::after{content:"▲"}
th[aria-sort=descending] button::after{content:"▼"}
tbody tr:hover{background:var(--wash)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--axis);border-bottom:0}
td.num,tfoot td{font-variant-numeric:tabular-nums}
td.wr{white-space:normal;min-width:170px;max-width:280px}
tr.sel td{background:var(--wash)}
.prog{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.prog .bar{position:relative;width:84px;height:7px;border-radius:4px;background:var(--wash);flex:none}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.prog .bar u{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink2);border-radius:1px}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.78rem;font-weight:600}
.tag.Atrasado{background:var(--bad-bg);color:var(--bad-t)}
.tag.Vencido{background:var(--warn-bg);color:var(--warn-t)}
.tag.Sem{background:var(--wash);color:var(--ink2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools input[type=search],.tools select{border:1px solid var(--axis);border-radius:var(--r-s);background:var(--surface2);padding:7px 10px;font-size:.9rem;min-width:0}
.tools input[type=search]{flex:1 1 220px;max-width:340px}
.count{font-size:.85rem;color:var(--mut)}
.empty{color:var(--ink2);padding:10px 0;margin:0}

/* ---------- detalhe do cliente */
.cli{appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:left;display:inline-flex;gap:6px;align-items:baseline;font-weight:600;color:var(--ink)}
.cli::before{content:"▸";color:var(--brand-t);font-size:.8rem;transition:transform .15s}
.cli[aria-expanded=true]::before{transform:rotate(90deg)}
.cli:hover{color:var(--brand-t)}
tr.det>td{background:var(--surface2);padding:0;white-space:normal;text-align:left}
.detin{position:sticky;left:0;width:var(--tw,100%);max-width:100vw;padding:14px 16px 16px}
tr.det:hover{background:none}
.det .why{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:4px;max-width:90ch}
.det .why li{padding-left:16px;position:relative;line-height:1.45}
.det .why li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.det .unis{display:grid;gap:8px;margin-bottom:16px}
.det .uni{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r-s);padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 22px;align-items:baseline}
.det .uni .rz{font-weight:600;flex:1 1 260px}
.det .uni span{font-size:.84rem;color:var(--ink2)}
.det .uni span b{color:var(--ink);font-weight:600}
.det .pcode{display:block;font-size:.76rem;color:var(--mut)}
.dia{display:grid;gap:10px}
.dia .cl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s)}
.dia .ch{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line)}
.dia .ch .nm{font-weight:600;flex:1 1 240px}
.dia .ch span{font-size:.84rem;color:var(--ink2)}
.dia .ch .tt{font-family:var(--fig);font-weight:600;color:var(--ink);font-size:.95rem}
.dia table{font-size:.83rem}
.dia td,.dia th{padding:6px 12px}
.dia .tw{border:0;border-radius:0}
.dia .dev td{color:var(--bad-t)}
.det .why b{font-weight:600}
.det h3{font-size:.9rem;font-weight:600;color:var(--ink2);margin:0 0 8px}
.det .tw{background:var(--surface)}
.det table{font-size:.83rem}
.det td,.det th{padding:6px 9px}
.det th{white-space:nowrap;min-width:0}

/* ---------- diretoria */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:8px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-m);padding:18px 22px;margin-bottom:22px;cursor:pointer;text-align:left;width:100%;appearance:none;font:inherit;color:inherit}
.hero.s-verde{border-left-color:var(--ok)} .hero.s-amarelo{border-left-color:var(--warn)} .hero.s-vermelho{border-left-color:var(--bad)}
.hero:hover{border-color:var(--axis)}
.hero .big{font-family:var(--fig);font-size:clamp(2.4rem,6vw,3.3rem);font-weight:600;line-height:1}
.hero .nm{font-size:1.15rem;font-weight:600}
.hero .ds{color:var(--ink2);font-size:.9rem;margin-top:2px}
.hero .go{color:#fff;background:var(--brand);font-size:.9rem;font-weight:600;border-radius:var(--r-s);padding:7px 14px}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .go{justify-self:start}}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.sec h2{font-size:1.1rem;font-weight:600;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pc{appearance:none;font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:var(--r-m);padding:13px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.pc.s-verde{border-left-color:var(--ok)} .pc.s-amarelo{border-left-color:var(--warn)} .pc.s-vermelho{border-left-color:var(--bad)}
.pc:hover{border-color:var(--axis)}
.pc .n{font-weight:600;line-height:1.25}
.pc .rl{font-size:.8rem;color:var(--mut)}
.pc .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px}
.pc .p{font-family:var(--fig);font-size:1.5rem;font-weight:600}
.pc .bar{position:relative;height:7px;border-radius:4px;background:var(--wash)}
.pc .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.pc .bar u{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink2);border-radius:1px}
.pc .ad{font-size:.8rem;color:var(--ink2)}
.sortsw{display:flex;gap:6px;font-size:.85rem;align-items:center;color:var(--ink2)}
.sortsw .ghost[aria-pressed=true]{border-color:var(--brand);color:var(--brand-t);font-weight:600}
.ranks{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:14px}
.ranks .card{margin-bottom:0}
.foot{font-size:.82rem;color:var(--mut);margin-top:22px;max-width:95ch;line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
.foot p{margin:0 0 6px}
.back{margin-bottom:14px}
@media print{.filters,.back,.actions{display:none}}
</style>
</head>
<body>
<noscript><div class="gate"><p>Ative o JavaScript para abrir o painel.</p></div></noscript>

async function derivarMestre(senha) {
  const base = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(ENVELOPE.s), iterations: ENVELOPE.it }, base, 256);
}
async function decifrar(mestre) {
  const hk = await crypto.subtle.importKey("raw", mestre, "HKDF", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "HKDF", hash: "SHA-256", salt: b64d(ENVELOPE.hs), info: enc.encode("fermentech-painel-faturamento-v1") },
    hk, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(ENVELOPE.iv), additionalData: enc.encode(ENVELOPE.id) }, key, b64d(ENVELOPE.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

  set(k) { try { localStorage.setItem(STORE_KEY, JSON.stringify({ s: ENVELOPE.s, k })); return true; } catch (e) { return false; } },

};

function h(tag, attrs, ...kids) {

    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);

    if (c == null || c === false) continue;
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }

/* ======================= regras de texto ======================= */
function resumo(t, cal) {
  const esp = cal.du_trans / cal.du_mes;
  if (t.meta == null) return "Sem meta cadastrada no mês. Realizado de " + R(t.real) + ".";
  if (t.meta_atingida) return P(t.pct) + " da meta: meta do mês atingida.";
  const pos = t.aderencia != null && t.aderencia >= 1 ? "acima" : "abaixo";
  let f = P(t.pct) + " da meta, " + pos + " do ritmo esperado de " + P(esp) + ".";
  if (cal.du_rest > 0) f += " Necessário " + R(t.necessario_dia) + " por dia " + plural(cal.du_rest, "no ", "nos ") + cal.du_rest + " " + plural(cal.du_rest, "dia útil restante", "dias úteis restantes") + ".";
  return f;
}

/* ======================= tabela ordenável ======================= */
function tabela(cols, rows, opts) {
  opts = opts || {};
  let sortKey = opts.sort || null, dir = opts.dir || -1;
  const thead = h("thead"), tbody = h("tbody"), tfoot = h("tfoot");
  const t = h("table", null, opts.caption ? h("caption", { class: "sr" }, opts.caption) : null, thead, tbody, tfoot);
  const hr = h("tr");
  cols.forEach(c => {
    const th = h("th", { class: c.l ? "l" : null, scope: "col" });
    if (c.sort === false) th.textContent = c.label;
    else th.appendChild(h("button", { type: "button", onclick: () => { if (sortKey === c.key) dir = -dir; else { sortKey = c.key; dir = c.l ? 1 : -1; } draw(); } }, c.label));
    th._c = c; hr.appendChild(th);
  });
  thead.appendChild(hr);
  let data = rows.slice();
  const val = (r, c) => c.v ? c.v(r) : r[c.key];
  function draw() {
    let d = data.slice();
    if (sortKey) {
      const c = cols.find(x => x.key === sortKey);
      d.sort((a, b) => {
        const x = val(a, c), y = val(b, c);
        if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
        return (typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y) * dir;
      });
    }
    if (opts.limit && opts.limit()) d = d.slice(0, opts.limit());
    hr.childNodes.forEach(th => { if (th._c.key === sortKey) th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending"); else th.removeAttribute("aria-sort"); });
    const trs = [];
    d.forEach(r => {
      const tr = h("tr", { class: opts.rowClass ? opts.rowClass(r) : null });
      tr._r = r;
      cols.forEach(c => { const td = h("td", { class: (c.l ? "l " : "num ") + (c.cls || "") }); const o = c.f ? c.f(r, tr) : val(r, c); if (o instanceof Node) td.appendChild(o); else td.textContent = o == null ? ND : o; tr.appendChild(td); });
      trs.push(tr);
      if (opts.after) { const x = opts.after(r, cols.length); if (x) trs.push(x); }
    });
    tbody.replaceChildren(...trs);
    if (!d.length && opts.empty) tbody.replaceChildren(h("tr", null, h("td", { colspan: cols.length, class: "l" }, opts.empty)));
    if (opts.onDraw) opts.onDraw(tbody);
  }
  if (opts.foot) { const tr = h("tr"); opts.foot.forEach((v, i) => tr.appendChild(h("td", { class: (cols[i] && cols[i].l) ? "l" : "num" }, v instanceof Node ? v : (v == null ? "" : v)))); tfoot.appendChild(tr); }

  return w;
}

  const colsH = [{ key: "d", label: "Data", l: true, f: r => {
      const bt = h("button", { class: "cli", type: "button", "aria-expanded": diasAbertos.has(r.d) ? "true" : "false" }, D(r.d) + (r.util ? "" : " (não útil)"));
      bt.addEventListener("click", () => { if (diasAbertos.has(r.d)) diasAbertos.delete(r.d); else diasAbertos.add(r.d); twH.table.redraw(); });
      return bt; } },
    { key: "total", label: "Total", f: r => R(r.total) }]
    .concat(F.map(f => ({ key: "f_" + f, label: f, v: r => r.f[f], f: r => R(r.f[f]) })))
    .concat([{ key: "notas", label: "Notas", f: r => N(r.notas) }, { key: "clientes", label: "Clientes", f: r => N(r.clientes) }]);
  const twH = tabela(colsH, p.historico, { caption: "Histórico diário", sort: "d", dir: -1,
    after: (r, nc) => diasAbertos.has(r.d) ? detalheDia(r, ctx, nc) : null });
  root.append(h("details", { class: "card" }, h("summary", null, h("h2", null, "Histórico diário do mês")),
    h("p", { class: "hint" }, "Clique na data para ver os clientes, as notas e os produtos faturados no dia."), twH));

  root.append(blocoClientes(p, ctx, opts.clientesOpts));

  const notas = [
    "Faturamento = notas de Venda e Devolução. Amostra, Bonificação e Devolução Amostra não entram.",
    "Dados até " + D(ctx.periodo.corte) + " (data de corte: última emissão na base). Dias úteis: segunda a sexta, exceto feriados.",
    "Ritmo = realizado ÷ meta esperada até hoje (meta × dias úteis concluídos ÷ dias úteis do mês). Verde a partir de " + P(ctx.limites_status.verde_aderencia_min) + ", amarelo a partir de " + P(ctx.limites_status.amarelo_aderencia_min) + ", vermelho abaixo disso. Projeção linear = média diária realizada × dias úteis do mês.",
    "Ciclo = mediana dos dias entre pedidos de venda de " + D(ctx.janela_ciclo.inicio) + " a " + D(ctx.janela_ciclo.fim) + ", com no mínimo 3 intervalos. Pedidos faturados após a data de corte não aparecem."
  ];
  if (p.funcao === "GC") notas.push("Commodities não são contabilizados nos painéis de Gerente de Contas.");
  if (p.funcao === "Consolidado") notas.push("O Consolidado inclui commodities; os painéis de Gerente de Contas não. Meta do Consolidado = soma das metas de CS.");
  root.append(h("footer", { class: "foot" }, notas.map(x => h("p", null, x))));

  let rt; const ro = new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => grafico(chartHost, p, ctx, fk), 120); });
  ro.observe(chartHost);
  outer._cleanup = () => ro.disconnect();
  upd();
  return outer;
}

/* ======================= diretoria ======================= */
function diretoria(data) {
  const app = document.getElementById("app");
  const cal = data.calendario, esp = cal.du_trans / cal.du_mes;
  let ordem = "nome", atual = null;
  function rank(lista, titulo) {
    const rows = lista.map(r => Object.assign({}, r));
    rows.slice().sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1)).forEach((r, i) => r.pos = i + 1);
    const cols = [
      { key: "pos", label: "#", f: r => r.pos },
      { key: "nome", label: "Nome", l: true, f: r => r.nome + (r.rotulo ? " · " + r.rotulo : "") },
      { key: "meta", label: "Meta", f: r => R(r.meta) },
      { key: "real", label: "Realizado", f: r => R(r.real) },
      { key: "pct", label: "% da meta", f: r => prog(r.pct, r.status, esp) },
      { key: "aderencia", label: "Ritmo", f: r => P(r.aderencia) },
      { key: "status", label: "Status", l: true, v: r => ({ verde: 0, amarelo: 1, vermelho: 2 })[r.status] ?? 3, f: r => pill(r.status) }
    ];
    return h("section", { class: "card" }, h("h2", null, titulo), h("p", { class: "hint" }, "Ordenado por % da meta. Clique no cabeçalho para mudar."), tabela(cols, rows, { caption: titulo, sort: "pct", dir: -1 }));
  }
  const abrir = id => { location.hash = "#/" + id; };
  function home() {
    const t = data.consolidado.totais;
    const outer = h("div");
    outer.append(cabecalho("Painéis de Faturamento", null, null, data));
    const root = h("div", { class: "wrap" }); outer.append(root);
    root.append(h("button", { class: "hero" + (t.status ? " s-" + t.status : ""), type: "button", onclick: () => abrir("consolidado") },
      h("div", { class: "big" }, P(t.pct)),
      h("div", null, h("div", { class: "nm" }, "Consolidado Fermentech"),
        h("div", { class: "ds" }, R(t.real) + " de " + R(t.meta) + " · ritmo " + P(t.aderencia) + " · projeção " + P(t.projecao_pct)),
        h("div", { style: "margin-top:8px" }, pill(t.status))),
      h("span", { class: "go" }, "Abrir painel")));
    const sw = h("div", { class: "sortsw" }, "Ordenar:",
      ...[["nome", "A–Z"], ["pct", "% da meta"]].map(([k, lab]) => h("button", { class: "ghost", type: "button", "aria-pressed": ordem === k ? "true" : "false", onclick: () => { ordem = k; render(); } }, lab)));
    const grade = lista => {
      const l = lista.slice().sort((a, b) => ordem === "pct" ? (b.pct ?? -1) - (a.pct ?? -1) : a.nome.localeCompare(b.nome, "pt-BR"));
      return h("div", { class: "grid" }, l.map(r => h("button", { class: "pc" + (r.status ? " s-" + r.status : ""), type: "button", onclick: () => abrir(r.id), "aria-label": r.nome + ", " + P(r.pct) + " da meta" },
        h("div", null, h("div", { class: "n" }, r.nome), r.rotulo ? h("div", { class: "rl" }, r.rotulo) : null),
        h("div", { class: "row" }, h("span", { class: "p" }, P(r.pct)), pill(r.status)),
        barra(r.pct, r.status, esp),
        h("div", { class: "ad" }, "Ritmo " + P(r.aderencia)))));
    };
    root.append(h("div", { class: "sec" }, h("h2", null, "CS1 · " + data.ranking.CS.length), sw), grade(data.ranking.CS));
    root.append(h("div", { class: "sec" }, h("h2", null, "Gerentes de Contas · " + data.ranking.GC.length)), grade(data.ranking.GC));
    root.append(h("footer", { class: "foot" }, h("p", null, "O traço nas barras marca o ritmo esperado hoje (" + P(esp) + " dos dias úteis). Status pelo ritmo: verde a partir de " + P(data.limites_status.verde_aderencia_min) + ", amarelo a partir de " + P(data.limites_status.amarelo_aderencia_min) + ", vermelho abaixo disso. O Consolidado inclui commodities; os painéis de Gerente de Contas não.")));
    return outer;
  }
  function render() {
    if (atual && atual._cleanup) atual._cleanup();
    const id = (location.hash || "").replace(/^#\//, "");
    const back = () => { location.hash = ""; };
    if (id === "consolidado") {
      const extra = h("div", { class: "ranks" }, rank(data.ranking.CS, "Ranking CS1"), rank(data.ranking.GC, "Ranking Gerentes de Contas"));
      atual = painel(data.consolidado, data, { back, extra, clientesOpts: { donos: true, top: 20 } });
    } else if (id && data.paineis[id]) {
      atual = painel(data.paineis[id], data, { back });
    } else {
      atual = home();
    }
    app.replaceChildren(atual);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", render);
  render();
}

/* ======================= início ======================= */
function erroRender() {
  document.getElementById("app").replaceChildren(h("div", { class: "gate" }, h("p", null, "Não foi possível montar o painel neste navegador. Atualize a página ou use uma versão atual do Chrome, Edge, Safari ou Firefox.")));
}
function sair() { store.clear(); location.hash = ""; location.reload(); }
function mostrar(data) {
  document.getElementById("gate").classList.add("hidden");
  const app = document.getElementById("app"); app.classList.remove("hidden");
  if (data.tipo === "diretoria") diretoria(data);
  else app.replaceChildren(painel(data.painel, data));
}
async function iniciar() {
  const gate = document.getElementById("gate");
  if (!ENVELOPE || !window.crypto || !crypto.subtle) {
    gate.classList.remove("hidden");
    document.getElementById("err").textContent = !ENVELOPE ? "Página sem dados." : "Este navegador não permite abrir o painel. Use uma versão atual do Chrome, Edge, Safari ou Firefox.";
    document.getElementById("go").disabled = true; return;
  }
  const salvo = store.get();
  if (salvo) {
    let data = null;
    try { data = await decifrar(b64d(salvo.k).buffer); } catch (e) { store.clear(); }
    if (data) { try { mostrar(data); } catch (e) { console.error(e); erroRender(); } return; }
  }
  gate.classList.remove("hidden");
  const form = document.getElementById("login"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
  pw.focus();
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Abrindo…";
    let data, mestre;
    try {
      mestre = await derivarMestre(pw.value);
      data = await decifrar(mestre);
    } catch (e) {
      err.textContent = "Senha incorreta. Confira e tente de novo.";
      go.disabled = false; go.textContent = "Abrir painel"; pw.select();
      return;
    }
    if (document.getElementById("rem").checked) store.set(b64e(mestre));
    pw.value = "";
    try { mostrar(data); } catch (e) { console.error(e); erroRender(); }
  });
}
iniciar();
</script>
